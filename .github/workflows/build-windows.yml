name: Build Windows EXE

on:
  push:
    branches: [typescript]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript + bundle
        run: npm run build

      - name: Build meta_ads.exe
        run: npm run package:meta

      - name: Build google_ads.exe
        run: npm run package:google

      - name: Prepare distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\MetaAdsManager
          Copy-Item dist\meta_ads.exe   dist\MetaAdsManager\
          Copy-Item dist\google_ads.exe dist\MetaAdsManager\
          Copy-Item .env.example        dist\MetaAdsManager\.env
          Copy-Item windows_build\setup.bat           dist\MetaAdsManager\
          Copy-Item windows_build\setup.ps1           dist\MetaAdsManager\
          Copy-Item windows_build\uninstall.bat       dist\MetaAdsManager\
          Copy-Item windows_build\uninstall.ps1       dist\MetaAdsManager\
          Copy-Item windows_build\INSTRUCCIONES.txt   dist\MetaAdsManager\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaAdsManager-Windows
          path: dist\MetaAdsManager\
          retention-days: 30

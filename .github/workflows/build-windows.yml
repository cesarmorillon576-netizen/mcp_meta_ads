name: Build Windows Distribution

on:
  push:
    branches: [typescript, sdk-meta-ads]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Extract the Node.js version used for Windows so the cache key stays
      # in sync automatically when build.mjs is updated.
      - name: Get Node.js Windows version
        id: node-win-ver
        run: |
          echo "version=$(grep 'NODE_VERSION' build.mjs | head -1 | grep -oP "v[\d.]+")" >> "$GITHUB_OUTPUT"

      - name: Cache Windows node.exe
        uses: actions/cache@v4
        with:
          path: windows_build/node.exe
          key: node-win-x64-${{ steps.node-win-ver.outputs.version }}

      - name: Install dependencies
        run: npm ci

      # Compiles TS → bundles JS → copies to windows_build/ → downloads node.exe
      # (download is skipped when the cache above restored node.exe)
      - name: Build
        run: npm run build

      - name: Create distribution ZIP
        run: |
          cd windows_build
          zip -r ../MetaAdsManager-Windows.zip . --exclude "*.bak*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaAdsManager-Windows
          path: MetaAdsManager-Windows.zip
          retention-days: 30

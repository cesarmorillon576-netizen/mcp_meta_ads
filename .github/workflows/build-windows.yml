name: Build Windows EXE

on:
  push:
    branches: [build/windows-exe]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build meta_ads.exe
        run: pyinstaller meta_ads.spec --noconfirm

      - name: Build google_ads.exe
        run: pyinstaller google_ads.spec --noconfirm

      - name: Prepare distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\MetaAdsManager
          Copy-Item dist\meta_ads.exe   dist\MetaAdsManager\
          Copy-Item dist\google_ads.exe dist\MetaAdsManager\
          Copy-Item .env.example        dist\MetaAdsManager\.env
          Copy-Item windows_build\setup.ps1          dist\MetaAdsManager\
          Copy-Item windows_build\INSTRUCCIONES.txt  dist\MetaAdsManager\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaAdsManager-Windows
          path: dist\MetaAdsManager\
          retention-days: 30
